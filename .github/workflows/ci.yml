name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0" # CI では husky の git hook インストールを無効化

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm vitest run src

      # 受け入れテスト（Python mahjong ライブラリとの相互検証）。
      # 参照実装は Docker イメージ riichi-mahjong-verifier 上で動かす。
      # 初回実行時にテスト側が docker/Dockerfile.verification から自動ビルドするが、
      # ログを分かりやすくするため事前に明示的にビルドしておく。
      - name: Build verifier image
        run: docker build -t riichi-mahjong-verifier -f docker/Dockerfile.verification .

      - name: Acceptance test
        run: pnpm test:acceptance

      - name: Build
        run: pnpm build
